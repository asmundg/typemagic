# Every push to main becomes a release, one patch version above the newest
# v* tag. Installed apps pick it up through lib/core/updater.dart.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs one at a time, so each run sees the tag the previous one created.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [version, analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.version }}
      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y typemagic-macos.zip typemagic.app
      - uses: actions/upload-artifact@v4
        with:
          name: typemagic-macos
          path: build/macos/Build/Products/Release/typemagic-macos.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [version, analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.version }}
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath typemagic-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: typemagic-windows
          path: typemagic-windows.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: typemagic-macos
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: typemagic-windows
          path: artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/typemagic-macos.zip
            artifacts/typemagic-windows.zip
